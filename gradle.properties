android.useAndroidX=true

# The default Gradle daemon heap (512m) is not enough to dex-merge this app's external dependencies
# (Compose + SignalR/RxJava + Firebase + ZXing), so :app:mergeExtDexDebug died with
# "OutOfMemoryError: Java heap space" inside R8/D8 on CI and no APK could be packaged. GitHub's
# ubuntu-latest runners have 16 GB, so 4 GB for the build JVM is comfortably within budget.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
