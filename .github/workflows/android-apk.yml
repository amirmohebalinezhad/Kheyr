name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      # Unit tests run before assembleDebug so a red suite fails the job fast,
      # rather than publishing an APK built from code that does not pass tests.
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      # if: always() so the HTML report is still uploaded when the tests fail,
      # which is exactly the case where it is needed to diagnose the failure.
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kheyr-unit-test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 30

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kheyr-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # The markdown backticks around the names are escaped: inside an unquoted
      # heredoc bash would otherwise treat them as command substitution and try to
      # execute the artifact name, mangling the summary (B-38).
      - name: Write install instructions to job summary
        env:
          ARTIFACT_NAME: kheyr-debug-apk-${{ github.sha }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Installable APK

          Download the artifact named \`$ARTIFACT_NAME\`, unzip it, and install \`app-debug.apk\` on your Android phone.
          EOF
